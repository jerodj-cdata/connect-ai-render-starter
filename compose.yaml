# Local development stack: the agent plus Postgres, mirroring render.yaml.
#   cp .env.example .env    # then fill in your credentials
#   docker compose up       # chat UI at http://localhost:8000
#   docker compose run --rm digest    # run the cron job once

x-app-env: &app-env
  # One image for both services, built once.
  build: .
  image: connectai-starter:dev
  env_file: .env
  environment:
    # Overrides .env so the containers reach the db service, not localhost.
    DATABASE_URL: postgresql://agent:agent@db:5432/agent
  extra_hosts:
    # Lets a local LLM gateway be reached as host.docker.internal on Linux
    # too; Docker Desktop and Colima already define it.
    - "host.docker.internal:host-gateway"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      # Reachable from this machine only, for psql or running the app outside Docker.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 2s
      timeout: 3s
      retries: 15

  agent:
    <<: *app-env
    ports:
      # This machine only: with APP_API_KEY empty the API needs no key, so it
      # must not be reachable from the rest of the network.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Mount the source and reload on change, so edits need no rebuild.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://agent:agent@db:5432/agent
      # Poll for changes: file events don't cross the VM boundary on Colima
      # (and some other Docker setups), so --reload would never fire.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/code/app
      - ./jobs:/code/jobs

  # The cron job. Not started by `docker compose up`; run it on demand.
  digest:
    <<: *app-env
    profiles: [job]
    command: python -m jobs.pipeline_digest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./jobs:/code/jobs

volumes:
  pgdata:
