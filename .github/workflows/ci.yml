name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        # Live tests skip without RUN_LIVE_TESTS=1; db and ui tests fail
        # rather than skip here, because CI is set.
        run: pytest

  pins:
    name: Pins match requirements.in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag, so pin the commit (v10.2.0).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Recompile and compare
        run: |
          uv pip compile requirements.in --universal --python-version 3.12 -o requirements.txt --quiet \
            --custom-compile-command "uv pip compile requirements.in --universal --python-version 3.12 -o requirements.txt"
          uv pip compile requirements-dev.in --universal --python-version 3.12 -o requirements-dev.txt --quiet \
            --custom-compile-command "uv pip compile requirements-dev.in --universal --python-version 3.12 -o requirements-dev.txt"
          git diff --exit-code -- requirements.txt requirements-dev.txt \
            || { echo "::error::requirements*.txt are out of date. Run the compile commands at the top of requirements*.in and commit the result."; exit 1; }

  docker:
    name: Local dev stack builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose.yaml
        run: cp .env.example .env && docker compose config --quiet
      - name: Build the image
        run: docker compose build
