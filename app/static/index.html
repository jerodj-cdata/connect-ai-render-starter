<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect AI Agent</title>
<!-- Vendored (see static/vendor/README.md), so the page needs no CDN. -->
<script src="/static/vendor/marked.umd.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1b1f24; --muted: #5f6b7a;
    --border: #dde2e8; --accent: #2563eb; --accent-text: #fff;
    --user: #2563eb; --user-text: #fff; --bot: #fff; --error-bg: #fdecec; --error: #b42318;
    --code: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #9aa5b1;
      --border: #2a313a; --accent: #4f8cff; --user: #3b6fd8; --bot: #171b21;
      --error-bg: #3a1a1a; --error: #ff8a80; --code: #222831;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100dvh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; }
  #status { font-size: 13px; color: var(--muted); flex: 1; }
  #status.bad { color: var(--error); }
  header a, header button {
    font: inherit; font-size: 13px; color: var(--muted); background: none;
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
    cursor: pointer; text-decoration: none;
  }
  header a:hover, header button:hover { color: var(--text); }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  #log { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg {
    padding: 10px 14px; border-radius: 10px; max-width: 90%;
    overflow-wrap: anywhere; border: 1px solid var(--border);
  }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); border: none; white-space: pre-wrap; }
  .bot { align-self: flex-start; background: var(--bot); }
  .bot > :first-child { margin-top: 0; } .bot > :last-child { margin-bottom: 0; }
  .bot table { border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; }
  .bot th, .bot td {
    border: 1px solid var(--border); padding: 4px 8px; text-align: left;
    white-space: nowrap; overflow-wrap: normal; /* scroll the table, don't split words */
  }
  .bot code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  .bot pre { background: var(--code); padding: 10px; border-radius: 6px; overflow-x: auto; }
  .bot pre code { padding: 0; }
  .thinking { color: var(--muted); min-width: 240px; }
  .thinking .elapsed { font-style: italic; }
  .steps { list-style: none; margin: 6px 0 0; padding: 0; font-size: 14px; }
  .steps li { padding: 2px 0 2px 22px; position: relative; color: var(--muted); }
  .steps li::before { position: absolute; left: 0; width: 16px; text-align: center; }
  .steps li.running::before { content: "…"; }
  .steps li.ok::before { content: "✓"; color: #1a7f37; }
  .steps li.failed::before { content: "✗"; color: var(--error); }
  .steps li.running { color: var(--text); }
  .steps pre { margin: 4px 0 2px; font-size: 12px; white-space: pre-wrap; }
  .trace { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 6px; font-size: 13px; }
  .trace summary { cursor: pointer; color: var(--muted); }
  .trace summary:hover { color: var(--text); }
  .followups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .followups button {
    font: inherit; font-size: 13px; text-align: left; cursor: pointer;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px;
  }
  .followups button:hover { border-color: var(--accent); }
  .error { align-self: stretch; max-width: none; background: var(--error-bg); color: var(--error); border-color: transparent; }
  #intro { text-align: center; color: var(--muted); margin-top: 8vh; }
  #intro h2 { color: var(--text); font-size: 20px; margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chips button {
    font: inherit; font-size: 14px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .chips button:hover { border-color: var(--accent); }
  form { padding: 12px 16px 16px; background: var(--bg); }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  textarea, input {
    flex: 1; font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; resize: none;
  }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button {
    font: inherit; background: var(--accent); color: var(--accent-text);
    border: none; border-radius: 8px; padding: 0 18px; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 820px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
  [hidden] { display: none !important; }
  @media (max-width: 600px) {
    header { flex-wrap: wrap; gap: 6px 8px; }
    header h1 { flex: 1; white-space: nowrap; }
    #status { order: 3; flex-basis: 100%; }
    main { padding: 12px; }
    .msg { max-width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Connect AI Agent</h1>
  <span id="status">Checking service…</span>
  <button id="new-chat" type="button">New chat</button>
  <button id="change-key" type="button">API key</button>
  <a href="/docs">API docs</a>
</header>

<main>
  <div id="log">
    <div id="intro">
      <h2>Ask about your live data</h2>
      <div>The agent explores your Connect AI connections and queries them with SQL.</div>
      <div class="chips">
        <button type="button">What data sources can you reach?</button>
        <button type="button">List the tables in one of my connections</button>
        <button type="button">What are our 5 largest open opportunities?</button>
      </div>
    </div>
  </div>
</main>

<form id="key-form" hidden>
  <div class="composer">
    <input id="key" type="password" autocomplete="off" placeholder="Paste APP_API_KEY">
    <button type="submit">Save key</button>
  </div>
  <div class="hint">Locally it is the APP_API_KEY in your .env. On Render, copy it from the web service's Environment tab. It is stored only in this browser.</div>
</form>

<form id="chat-form" hidden>
  <div class="composer">
    <textarea id="message" rows="2" maxlength="4000" placeholder="Ask a question… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
let threadId = null;

// localStorage can throw (private windows, blocked storage); the page still
// works, it just asks for the key again next visit.
const store = {
  get() { try { return localStorage.getItem("app_api_key") || ""; } catch { return ""; } },
  set(v) { try { localStorage.setItem("app_api_key", v); } catch {} },
  clear() { try { localStorage.removeItem("app_api_key"); } catch {} },
};
let apiKey = store.get();

function render(markdown) {
  if (window.marked && window.DOMPurify) {
    return DOMPurify.sanitize(marked.parse(markdown));
  }
  const div = document.createElement("div");  // CDN blocked: plain text
  div.style.whiteSpace = "pre-wrap";
  div.textContent = markdown;
  return div.outerHTML;
}

function add(kind, content, { html = false } = {}) {
  $("intro")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + kind;
  if (html) el.innerHTML = content; else el.textContent = content;
  log.appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "end" });
  return el;
}

function showKeyForm(message) {
  $("chat-form").hidden = true;
  $("key-form").hidden = false;
  if (message) add("error", message);
  $("key").focus();
}

function showChat() {
  $("key-form").hidden = true;
  $("chat-form").hidden = false;
  $("message").focus();
}

async function checkHealth() {
  const status = $("status");
  try {
    const res = await fetch("/healthz");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const h = await res.json();
    status.textContent = `${h.mcp_tools} Connect AI tools · ${h.llm_model}`;
    status.classList.toggle("bad", h.mcp_tools === 0);
    return h;
  } catch (err) {
    status.textContent = "Service unreachable: " + err.message;
    status.classList.add("bad");
    return null;
  }
}

// One <li> per tool call. Labels and SQL come from the server as plain text
// and are only ever set with textContent.
function stepItem(step) {
  const li = document.createElement("li");
  li.className = "running";
  li.dataset.id = step.id;
  li.append(step.label);
  if (step.sql) {
    const pre = document.createElement("pre");
    const code = document.createElement("code");
    code.textContent = step.sql;
    pre.append(code);
    li.append(pre);
  }
  return li;
}

// Collapsible "how I got this" section under an answer: every step, with
// the SQL shown inline under each query.
function trace(steps, seconds) {
  const queries = steps.filter((s) => s.sql).length;
  const details = document.createElement("details");
  details.className = "trace";
  const summary = document.createElement("summary");
  summary.textContent = [
    `${steps.length} step${steps.length === 1 ? "" : "s"}`,
    queries ? `${queries} SQL quer${queries === 1 ? "y" : "ies"}` : null,
    `${seconds}s`,
  ].filter(Boolean).join(" · ");
  const list = document.createElement("ol");
  list.className = "steps";
  for (const s of steps) {
    const li = stepItem(s);
    li.className = s.ok === false ? "failed" : "ok";
    list.append(li);
  }
  details.append(summary, list);
  return details;
}

// Follow-up chips under the latest answer. Only the newest answer keeps them.
let latestAnswer = null;
// Each send gets a number; only the newest may re-enable the Send button. An
// older request can still be open, waiting for its suggestions.
let latestRequest = 0;

function showFollowups(answer, items) {
  if (answer !== latestAnswer || !items.length) return;  // a newer question was asked
  const box = document.createElement("div");
  box.className = "followups";
  for (const q of items) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = q;
    b.addEventListener("click", () => { if (!$("send").disabled) send(q); });
    box.append(b);
  }
  answer.append(box);
  box.scrollIntoView({ behavior: "smooth", block: "end" });
}

async function send(text) {
  const request = ++latestRequest;
  document.querySelectorAll(".followups").forEach((el) => el.remove());
  latestAnswer = null;
  add("user", text);
  const thinking = add("bot thinking", "");
  const elapsed = document.createElement("div");
  elapsed.className = "elapsed";
  const list = document.createElement("ol");
  list.className = "steps";
  thinking.append(elapsed, list);
  const started = Date.now();
  const seconds = () => Math.round((Date.now() - started) / 1000);
  const tick = () => { elapsed.textContent = `Working… ${seconds()}s`; };
  tick();
  const timer = setInterval(tick, 1000);
  const steps = [];
  let finished = false;
  let answer = null;

  const handle = (event) => {
    if (event.type === "start") {
      threadId = event.thread_id;
    } else if (event.type === "step") {
      steps.push(event);
      list.append(stepItem(event));
      thinking.scrollIntoView({ block: "end" });
    } else if (event.type === "step_done") {
      const step = steps.find((s) => s.id === event.id);
      if (step) step.ok = event.ok;
      const li = list.querySelector(`li[data-id="${CSS.escape(event.id)}"]`);
      if (li) li.className = event.ok ? "ok" : "failed";
    } else if (event.type === "done") {
      finished = true;
      thinking.remove();
      answer = add("bot", render(event.reply), { html: true });
      if (steps.length) answer.append(trace(steps, seconds()));
      latestAnswer = answer;
      clearInterval(timer);
      if (request === latestRequest) $("send").disabled = false;  // don't wait for suggestions
    } else if (event.type === "suggestions") {
      if (answer) showFollowups(answer, event.items);
    } else if (event.type === "error") {
      finished = true;
      thinking.remove();
      add("error", "Error: " + event.detail);
    }
  };

  $("send").disabled = true;
  try {
    const headers = { "Content-Type": "application/json" };
    if (apiKey) headers["Authorization"] = "Bearer " + apiKey;
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers,
      body: JSON.stringify({ message: text, thread_id: threadId }),
    });
    if (res.status === 401) {
      thinking.remove();
      store.clear(); apiKey = "";
      return showKeyForm("That API key was rejected. Paste the current APP_API_KEY.");
    }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      const detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail ?? body);
      thinking.remove();
      return add("error", `Error ${res.status}: ${detail}`);
    }
    // Newline-delimited JSON: one event per line, possibly split across chunks.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let newline;
      while ((newline = buffer.indexOf("\n")) >= 0) {
        const lineText = buffer.slice(0, newline).trim();
        buffer = buffer.slice(newline + 1);
        if (lineText) handle(JSON.parse(lineText));
      }
    }
    if (!finished) {
      thinking.remove();
      add("error", "The connection closed before the answer arrived. Check the service logs.");
    }
  } catch (err) {
    thinking.remove();
    add("error", "Could not reach the service: " + err.message);
  } finally {
    clearInterval(timer);
    if (request === latestRequest) $("send").disabled = false;
  }
}

$("key-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("key").value.trim();
  if (!v) return;
  apiKey = v; store.set(v); $("key").value = "";
  showChat();
});

$("chat-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("message").value.trim();
  if (!text || $("send").disabled) return;
  $("message").value = "";
  send(text);
});

$("message").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("chat-form").requestSubmit();
  }
});

// Assume a key is needed until /healthz says otherwise (locally, with
// APP_API_KEY empty, it isn't).
let authRequired = true;

document.querySelectorAll(".chips button").forEach((b) =>
  b.addEventListener("click", () => {
    if (authRequired && !apiKey) return showKeyForm();
    send(b.textContent);
  })
);

$("new-chat").addEventListener("click", () => location.reload());
$("change-key").addEventListener("click", () => showKeyForm());

checkHealth().then((h) => {
  authRequired = h ? h.auth_required !== false : true;
  $("change-key").hidden = !authRequired;
  !authRequired || apiKey ? showChat() : showKeyForm();
});
</script>
</body>
</html>
